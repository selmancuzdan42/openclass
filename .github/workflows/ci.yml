name: CI

# Bu akış yalnızca **doğrular**: biçim, lint, test ve derleme kontrolü.
#
# Sürüm paketleri burada üretilmez. Kurulum dosyaları yerelde (Linux'tan
# cargo-xwin + NSIS ile) derlenip sürüm sayfasına elle yüklenir; böylece
# yayımlanan ikilinin tam olarak hangi ağaçtan çıktığı elde tutulur.

# Her itmede koşmaz. Doğrulama yerelde yapılıyor (`scripts/build-windows.sh`
# derlemeden önce Windows hedefinde clippy koşar, testler Wine altında
# çalıştırılabilir), bu yüzden akış yalnızca dışarıdan gelen değişikliklerde
# ve elle istendiğinde tetiklenir.
on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust — test ve lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux GUI bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Biçimlendirme
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testler
        run: cargo test --workspace

  windows-build:
    name: Windows — derleme kontrolü
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Windows'a özgü kod yolları (DPAPI, ekran yakalama) yalnızca burada
      # derlenir; Linux işinde cfg ile dışarıda kalırlar.
      - name: Clippy (Windows hedefi)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testler
        run: cargo test --workspace

  frontend:
    name: Arayüz — tip denetimi ve derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build --workspace @openclass/teacher
      - run: npm run build --workspace @openclass/student
