[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/common",
    "crates/screen",
    "apps/teacher/src-tauri",
    "apps/student/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
repository = "https://github.com/selmancuzdan42/openclass"
authors = ["OpenClass katkıcıları"]

[workspace.dependencies]
openclass-protocol = { path = "crates/protocol" }
openclass-common   = { path = "crates/common" }
openclass-screen   = { path = "crates/screen" }

# Serileştirme
serde       = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json  = "1.0.154"
rmp-serde   = "1.3.1"

# Async / ağ
tokio             = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-util        = { version = "0.7.20", features = ["codec"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
futures-util      = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
bytes             = "1.12"

# TLS
rustls         = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls   = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2.2.0"
rcgen          = { version = "0.14.10", default-features = false, features = ["pem", "crypto", "ring"] }

# Kriptografi
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
sha2          = "0.11.1"
chacha20poly1305 = "0.11.0"
hmac          = "0.13.0"
getrandom     = "0.4.3"
subtle        = "2.6"

# Depolama
rusqlite = { version = "0.41.0", features = ["bundled"] }

# Loglama
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender   = "0.2.5"

# Yardımcılar
thiserror   = "2.0.21"
anyhow      = "1.0.104"
uuid        = { version = "1.29", features = ["v4", "serde"] }
hostname    = "0.4.2"
parking_lot = "0.13.0"
directories = "6.0.0"
time        = { version = "0.3", features = ["formatting", "macros"] }

# Görüntü
jpeg-encoder = "0.7.1"

# Tauri
tauri        = { version = "2.12", features = [] }
tauri-build  = { version = "2.7", features = [] }

# Başarım ölçümü için: sürüm derlemesi kadar optimize, ama `debug_assertions`
# açık olduğu için test kolaylıkları (sabit eşleştirme kodu, kendiliğinden
# başlatma, test deseni) çalışır. Yayımlanan paketlerde kullanılmaz.
[profile.testlab]
inherits = "release"
debug-assertions = true

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
panic         = "abort"
